server:
  port: 9091
  servlet:
    context-path: /api

spring:
  application:
    name: accounting-backend
  profiles:
    active: prod
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.accounting.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# 微信小程序配置
wechat:
  appid: wx159e46d91d603ac7
  secret: 86d821c9fb156ddc0d0da828a82a7168

# JWT 配置
jwt:
  secret: accounting-app-jwt-secret-key-2024
  expiration: 604800000  # 7天

# 日志配置
logging:
  # 控制台带上 MDC 中的 traceId（由 TraceIdFilter 写入，键名见 TraceIdFilter.TRACE_ID_MDC_KEY）
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p %clr(${PID:- }){magenta} --- [%15.15t] %clr([traceId:%X{traceId:-}]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
  level:
    com.accounting: debug
    # 避免 MyBatis Mapper 在 debug 下持续打印 SQL（需要排错时可改为 debug）
    com.accounting.mapper: info

  # Controller 入参/出参日志（AOP）
  controller-io:
    enabled: true
    log-args: true
    log-result: true
    max-len: 32768
    masking: none
    exclude-paths:
      - /api/user/login
      - /api/user/wxLogin
      - /error

# AI记账（阿里百炼）
ai:
  bailian:
    api-key: sk-3a24e8acd3984b43971f0832fd6e0d70
    agent:
      app-id: 61395759fd114661b8ae70378b5e196e
  asr:
    realtime-model: paraformer-realtime-v2
  debug:
    save-voice: true
    voice-dir: backend/debug-audio
