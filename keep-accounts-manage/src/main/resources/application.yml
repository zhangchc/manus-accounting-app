server:
  port: 9092
  servlet:
    context-path: /manage

spring:
  application:
    name: accounting-manage
  profiles:
    active: prod
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  datasource:
    druid:
      url: jdbc:mysql://localhost:3306/accounting?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.accounting.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# JWT 配置
jwt:
  secret: accounting-manage-jwt-secret-key-2024
  expiration: 86400000  # 24小时

# 日志配置
logging:
  level:
    com.accounting: debug
    com.accounting.mapper: info
